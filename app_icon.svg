<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glassGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="1.0" stop-color="#ffffff" stop-opacity="0.015" />
    </linearGradient>
  </defs>

  <!-- 1. Pure Pitch Black Background -->
  <rect width="512" height="512" fill="#000000" />

  <!-- 2. Frosted Glass Container Card -->
  <rect x="64" y="64" width="384" height="384" rx="96" ry="96" fill="url(#glassGrad)" />

  <!-- 3. Glass Rim Highlight Outline -->
  <rect x="64" y="64" width="384" height="384" rx="96" ry="96" fill="none" stroke="#ffffff" stroke-opacity="0.21" stroke-width="2.5" />

  <!-- 4. Frosted Glass Border Contour Framing the Letter 'M' -->
  <path d="M 160,352 V 176 L 256,272 L 352,176 V 352" fill="none" stroke="#ffffff" stroke-opacity="0.31" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 5. Core Monogram 'M' (Primary Color #D6A87C) -->
  <path d="M 160,352 V 176 L 256,272 L 352,176 V 352" fill="none" stroke="#D6A87C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
</svg>
