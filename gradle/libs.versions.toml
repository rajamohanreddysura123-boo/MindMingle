[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "29"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.19.0"
androidx-espresso = "3.7.0"
# Must stay on the version Compose Multiplatform 1.11.1 and koin-compose-viewmodel are both
# compiled against (2.9.6). On Kotlin/Native a newer lifecycle makes koinViewModel() fail at
# runtime with an IrLinkageError on LocalViewModelStoreOwner's private $stable backing field,
# which shows up as a black screen on iOS.
androidx-lifecycle = "2.9.6"
androidx-testExt = "1.3.0"
# Pinned below 3.5: from 3.5.0 Coil's Android artifacts are built against SDK 37, which this
# project cannot compile against — AGP 9.0.1 supports 36 at most.
coil = "3.4.0"
composeMultiplatform = "1.11.1"
firebaseKotlinSdk = "2.5.0"
firebaseBom = "33.14.0"
googleServices = "4.4.3"
googleAds = "25.4.0"
# User Messaging Platform — the consent form AdMob requires for EEA/UK users. Versioned
# separately from the ads SDK, which only pulls it in transitively.
googleUmp = "3.2.0"
mlkitFaceDetection = "16.1.7"
junit = "4.13.2"
kotlin = "2.4.10"
ktor = "3.5.2"
kotlinx-coroutines = "1.11.0"
koin = "4.2.2"
napier = "2.7.1"
playAppUpdate = "2.1.0"
razorpay = "1.6.41"
razorpayCore = "1.7.18"
material3 = "1.11.0-alpha07"
kotlinx-serialization = "1.8.0"


[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# Profile photos live in Firebase Storage, so every one of them is a network image. Coil is the
# only multiplatform loader that covers Android, iOS and desktop from commonMain; its ktor3
# network layer needs one engine per target (below).
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebaseKotlinSdk" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebaseKotlinSdk" }
firebase-storage = { module = "dev.gitlive:firebase-storage", version.ref = "firebaseKotlinSdk" }
firebase-functions = { module = "dev.gitlive:firebase-functions", version.ref = "firebaseKotlinSdk" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version = "21.3.0" }
# Google Play In-App Updates. This is the modern standalone artifact that replaced the
# monolithic com.google.android.play:core, which is unusable on targetSdk 31+.
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "googleAds" }
google-ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "googleUmp" }
mlkit-face-detection = { module = "com.google.mlkit:face-detection", version.ref = "mlkitFaceDetection" }
razorpay-checkout = { module = "com.razorpay:checkout", version.ref = "razorpay" }
# The checkout wrapper POM asks for standard-core "LATEST"; pinning it keeps builds reproducible.
razorpay-standardCore = { module = "com.razorpay:standard-core", version.ref = "razorpayCore" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }